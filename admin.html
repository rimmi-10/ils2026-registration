<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEEE WIE ILS 2026 — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f7eeff; min-height: 100vh; color: #2c1a40; }
  .hero {
    background: linear-gradient(135deg, #6a1794 0%, #b8005e 100%);
    padding: 1.5rem; text-align: center; color: white;
  }
  .hero h1 { font-size: 1.4rem; font-weight: 700; }
  .hero .tagline { font-size: 12.5px; color: rgba(255,255,255,0.8); margin-top: 4px; }

  /* ── LOGIN ── */
  .login-wrap { max-width: 380px; margin: 3rem auto; padding: 0 1rem; }
  .card {
    background: white; border-radius: 16px; padding: 1.75rem;
    border: 0.5px solid #e2c8f5; box-shadow: 0 2px 14px rgba(106,23,148,0.07);
  }
  .card h2 { font-size: 17px; color: #6a1794; margin-bottom: 1.25rem; }
  .field-row { margin-bottom: 1rem; }
  label { display: block; font-size: 13px; font-weight: 500; color: #4a1b6e; margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px; border: 1.5px solid #ddc4f0;
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: #fdf8ff; outline: none;
  }
  input:focus { border-color: #8c3ec0; background: white; }
  .btn {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #6a1794, #b8005e); color: white;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn:hover { opacity: 0.92; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary {
    background: white; color: #6a1794; border: 1.5px solid #ddc4f0;
  }
  .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 1rem; display: none; }
  .msg.error { background: #fff5f9; border: 1px solid #f0a0c0; color: #8b0038; }

  /* ── DASHBOARD ── */
  .dash { display: none; max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; gap: 12px; flex-wrap: wrap; }
  .dash-top .btn { width: auto; padding: 9px 18px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .stat-box {
    background: white; border-radius: 12px; padding: 14px 20px; flex: 1; min-width: 130px;
    border: 0.5px solid #e2c8f5; box-shadow: 0 2px 14px rgba(106,23,148,0.07);
  }
  .stat-box .num { font-size: 22px; font-weight: 700; color: #6a1794; }
  .stat-box .lbl { font-size: 12px; color: #7c2ab0; margin-top: 2px; }
  .controls { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
  .controls input, .controls select {
    padding: 9px 12px; border: 1.5px solid #ddc4f0; border-radius: 8px;
    font-size: 13px; font-family: inherit; background: white; outline: none;
  }
  .controls input { flex: 1; min-width: 200px; }
  .table-wrap {
    background: white; border-radius: 12px; overflow: auto; max-height: 70vh;
    border: 0.5px solid #e2c8f5; box-shadow: 0 2px 14px rgba(106,23,148,0.07);
  }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; white-space: nowrap; }
  th {
    background: #6a1794; color: white; text-align: left; padding: 10px 12px;
    position: sticky; top: 0; font-weight: 600; z-index: 1;
  }
  td { padding: 9px 12px; border-bottom: 1px solid #f0d5fa; }
  tr:hover td { background: #fdf8ff; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
    background: #f3eaff; color: #7c2ab0;
  }
  a.filelink { color: #6a1794; font-weight: 600; text-decoration: none; }
  a.filelink:hover { text-decoration: underline; }
  .empty-cell { color: #c0a8d8; }
  .loading, .empty-state { text-align: center; padding: 3rem; color: #7c2ab0; font-size: 14px; }

  /* ── BROADCAST ── */
  .sel-count { font-size: 13px; color: #4a1b6e; font-weight: 600; align-self: center; }
  input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #6a1794; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(44,26,64,0.55);
    z-index: 1000; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: white; border-radius: 16px; max-width: 520px; width: 100%;
    max-height: 90vh; overflow-y: auto; padding: 1.5rem;
  }
  .modal-box h3 { font-size: 16px; color: #6a1794; margin-bottom: 1rem; }
  textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid #ddc4f0;
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: #fdf8ff; outline: none; min-height: 140px; resize: vertical;
  }
  textarea:focus { border-color: #8c3ec0; background: white; }
  .modal-actions { display: flex; gap: 10px; margin-top: 1.25rem; }
  .modal-actions .btn { width: auto; flex: 1; }
  .msg.success { background: #f0fff7; border: 1px solid #6fcf97; color: #1a6b3a; }
</style>
</head>
<body>

<div class="hero">
  <h1>IEEE WIE ILS 2026 — Admin Portal</h1>
  <div class="tagline">Registration data &amp; submitted files</div>
</div>

<div class="login-wrap" id="loginWrap">
  <div class="card">
    <h2>Admin Login</h2>
    <div class="msg error" id="loginError"></div>
    <div class="field-row">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field-row">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Sign In</button>
  </div>
</div>

<div class="dash" id="dash">
  <div class="dash-top">
    <div class="stats" id="stats"></div>
    <button class="btn btn-secondary" style="width:auto;" onclick="logout()">Log Out</button>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search by team, leader, college, email..." oninput="renderTable()">
    <select id="roundFilter" onchange="renderTable()">
      <option value="">All Rounds</option>
      <option value="Round 1">Round 1</option>
      <option value="Round 2">Round 2</option>
      <option value="Round 3">Round 3</option>
    </select>
    <span class="sel-count" id="selCount">0 selected</span>
    <button class="btn" style="width:auto;" onclick="openBroadcast()">✉ Broadcast Email</button>
    <button class="btn btn-secondary" style="width:auto;" onclick="exportCsv()">Export CSV</button>
    <button class="btn btn-secondary" style="width:auto;" onclick="loadData()">Refresh</button>
  </div>
  <div class="table-wrap">
    <div id="tableHost"><div class="loading">Loading…</div></div>
  </div>
</div>

<!-- BROADCAST MODAL -->
<div class="modal-overlay" id="broadcastModal">
  <div class="modal-box">
    <h3>✉ Broadcast Email</h3>
    <div class="msg error" id="broadcastError"></div>
    <div class="msg success" id="broadcastSuccess"></div>
    <div class="field-row">
      <label id="recipientLabel">Sending to 0 recipients</label>
    </div>
    <div class="field-row">
      <label for="bcCc">CC <span style="font-weight:400; color:#9b7ab0;">— Optional, comma-separated</span></label>
      <input type="text" id="bcCc" placeholder="e.g. wieils2026@gmail.com">
    </div>
    <div class="field-row">
      <label for="bcSubject">Subject</label>
      <input type="text" id="bcSubject" placeholder="e.g. Round 1 results — next steps">
    </div>
    <div class="field-row">
      <label for="bcBody">Message</label>
      <textarea id="bcBody" placeholder="Write your message here..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeBroadcast()">Cancel</button>
      <button class="btn" id="sendBtn" onclick="sendBroadcast()">Send</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gfoclvqlkylujopcvuht.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmb2NsdnFsa3lsdWpvcGN2dWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDY0MzAsImV4cCI6MjEwMDYyMjQzMH0.NjzuL10jUM3HJQaEu2rkZwuqyx0JCGgqlD-HDVunhwE";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allRows = [];
  let selectedIds = new Set();

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if (!email || !password) { errEl.textContent = 'Enter email and password.'; errEl.style.display = 'block'; return; }
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('loginBtn').textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'Sign In';
    if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
    showDashboard();
  }

  async function logout() {
    await sb.auth.signOut();
    document.getElementById('dash').style.display = 'none';
    document.getElementById('loginWrap').style.display = 'block';
  }

  async function showDashboard() {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    await loadData();
  }

  async function loadData() {
    document.getElementById('tableHost').innerHTML = '<div class="loading">Loading…</div>';
    const { data, error } = await sb.from('registrations').select('*').order('created_at', { ascending: false });
    if (error) {
      document.getElementById('tableHost').innerHTML = '<div class="empty-state">Failed to load: ' + error.message + '</div>';
      return;
    }
    allRows = data || [];
    renderStats();
    renderTable();
  }

  function renderStats() {
    const byRound = {};
    allRows.forEach(r => { byRound[r.round] = (byRound[r.round]||0) + 1; });
    let html = '<div class="stat-box"><div class="num">' + allRows.length + '</div><div class="lbl">Total Registrations</div></div>';
    Object.keys(byRound).sort().forEach(round => {
      html += '<div class="stat-box"><div class="num">' + byRound[round] + '</div><div class="lbl">' + escapeHtml(round) + '</div></div>';
    });
    document.getElementById('stats').innerHTML = html;
  }

  function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fileLink(url, label) {
    if (!url) return '<span class="empty-cell">—</span>';
    return '<a class="filelink" href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
  }

  function renderTable() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const roundF = document.getElementById('roundFilter').value;
    let rows = allRows;
    if (roundF) rows = rows.filter(r => r.round === roundF);
    if (q) {
      rows = rows.filter(r => [r.team_name, r.leader_name, r.college, r.leader_email, r.leader_phone]
        .some(v => (v||'').toLowerCase().includes(q)));
    }
    if (rows.length === 0) {
      document.getElementById('tableHost').innerHTML = '<div class="empty-state">No registrations match.</div>';
      return;
    }
    let html = '<table><thead><tr>' +
      '<th><input type="checkbox" id="selectAllBox" onclick="toggleSelectAll(this)"></th>' +
      '<th>Submitted</th><th>Round</th><th>Entry</th><th>Team</th><th>College</th><th>Track</th><th>Problem Statement</th>' +
      '<th>Leader Name</th><th>Gender</th><th>Email</th><th>Phone</th><th>Year</th><th>Dept</th><th>IEEE #</th>' +
      '<th>Members</th><th>ILS Reg ID</th><th>Payment</th><th>Supporting Doc</th>' +
      '</tr></thead><tbody>';
    rows.forEach(r => {
      const members = Array.isArray(r.members) ? r.members : [];
      const membersStr = members.length
        ? members.map(m => escapeHtml(m.name) + (m.gender ? ' (' + escapeHtml(m.gender) + ')' : '')).join(', ')
        : '<span class="empty-cell">—</span>';
      html += '<tr>' +
        '<td><input type="checkbox" data-id="' + r.id + '" ' + (selectedIds.has(r.id) ? 'checked' : '') + ' onclick="toggleSelect(\'' + r.id + '\')"></td>' +
        '<td>' + escapeHtml(new Date(r.created_at).toLocaleString('en-IN', {timeZone:'Asia/Kolkata'})) + '</td>' +
        '<td><span class="pill">' + escapeHtml(r.round) + '</span></td>' +
        '<td>' + escapeHtml(r.entry_type) + '</td>' +
        '<td>' + escapeHtml(r.team_name) + '</td>' +
        '<td>' + escapeHtml(r.college) + '</td>' +
        '<td>' + escapeHtml(r.track) + '</td>' +
        '<td>' + escapeHtml(r.problem_statement) + '</td>' +
        '<td>' + escapeHtml(r.leader_name) + '</td>' +
        '<td>' + escapeHtml(r.leader_gender) + '</td>' +
        '<td>' + escapeHtml(r.leader_email) + '</td>' +
        '<td>' + escapeHtml(r.leader_phone) + '</td>' +
        '<td>' + escapeHtml(r.leader_year) + '</td>' +
        '<td>' + escapeHtml(r.leader_dept) + '</td>' +
        '<td>' + escapeHtml(r.leader_ieee) + '</td>' +
        '<td>' + membersStr + '</td>' +
        '<td>' + escapeHtml(r.ils_reg_id) + '</td>' +
        '<td>' + fileLink(r.payment_screenshot_url, 'View') + '</td>' +
        '<td>' + fileLink(r.supporting_doc_url, r.supporting_doc_name || 'View') + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('tableHost').innerHTML = html;
    const allVisible = rows.length > 0 && rows.every(r => selectedIds.has(r.id));
    const selectAllBox = document.getElementById('selectAllBox');
    if (selectAllBox) selectAllBox.checked = allVisible;
    updateSelCount();
  }

  function toggleSelect(id) {
    if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    updateSelCount();
  }

  function toggleSelectAll(box) {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const roundF = document.getElementById('roundFilter').value;
    let rows = allRows;
    if (roundF) rows = rows.filter(r => r.round === roundF);
    if (q) rows = rows.filter(r => [r.team_name, r.leader_name, r.college, r.leader_email, r.leader_phone].some(v => (v||'').toLowerCase().includes(q)));
    rows.forEach(r => { if (box.checked) selectedIds.add(r.id); else selectedIds.delete(r.id); });
    renderTable();
  }

  function updateSelCount() {
    document.getElementById('selCount').textContent = selectedIds.size + ' selected';
  }

  function computeRecipients() {
    const emails = new Set();
    allRows.filter(r => selectedIds.has(r.id)).forEach(r => {
      if (r.leader_email) emails.add(r.leader_email.trim());
      (Array.isArray(r.members) ? r.members : []).forEach(m => { if (m.email) emails.add(m.email.trim()); });
    });
    return Array.from(emails).filter(Boolean);
  }

  function openBroadcast() {
    if (selectedIds.size === 0) { alert('Select at least one team first (checkbox in the table).'); return; }
    const recipients = computeRecipients();
    document.getElementById('recipientLabel').textContent = 'Sending to ' + recipients.length + ' recipient(s) across ' + selectedIds.size + ' team(s)';
    document.getElementById('bcCc').value = '';
    document.getElementById('bcSubject').value = '';
    document.getElementById('bcBody').value = '';
    document.getElementById('broadcastError').style.display = 'none';
    document.getElementById('broadcastSuccess').style.display = 'none';
    document.getElementById('broadcastModal').classList.add('open');
  }

  function closeBroadcast() {
    document.getElementById('broadcastModal').classList.remove('open');
  }

  function buildEmailHtml(subject, bodyText) {
    const paragraphs = bodyText.split(/\n\s*\n/).map(p =>
      '<p style="margin:0 0 14px; line-height:1.7; color:#2c1a40; font-size:14px;">' +
      escapeHtml(p).replace(/\n/g, '<br>') + '</p>'
    ).join('');
    return '<!DOCTYPE html><html><body style="margin:0; padding:0; background:#f7eeff; font-family:Arial,Helvetica,sans-serif;">' +
      '<div style="max-width:600px; margin:0 auto; background:#f7eeff;">' +
      '<div style="background:linear-gradient(135deg,#6a1794,#b8005e); padding:28px 24px; text-align:center; color:white;">' +
      '<div style="font-size:19px; font-weight:700;">IEEE WIE ILS 2026</div>' +
      '<div style="font-size:13px; opacity:0.9; margin-top:4px;">National Hackathon</div>' +
      '</div>' +
      '<div style="background:white; padding:28px 24px; border:1px solid #e2c8f5; border-top:none;">' +
      '<h2 style="margin:0 0 16px; font-size:17px; color:#6a1794;">' + escapeHtml(subject) + '</h2>' +
      paragraphs +
      '</div>' +
      '<div style="text-align:center; padding:18px 12px; font-size:11.5px; color:#7c2ab0;">' +
      'IEEE WIE ILS 2026 National Hackathon &middot; Queries: Madhav Maheshwari, +91 95888 74415 &middot; ieeegujaratsection.org' +
      '</div>' +
      '</div></body></html>';
  }

  async function sendBroadcast() {
    const subject = document.getElementById('bcSubject').value.trim();
    const body = document.getElementById('bcBody').value.trim();
    const cc = document.getElementById('bcCc').value.split(',').map(s => s.trim()).filter(Boolean);
    const errEl = document.getElementById('broadcastError');
    const okEl = document.getElementById('broadcastSuccess');
    errEl.style.display = 'none'; okEl.style.display = 'none';
    if (!subject || !body) { errEl.textContent = 'Subject and message are both required.'; errEl.style.display = 'block'; return; }
    const invalidCc = cc.filter(e => !isValidEmail(e));
    if (invalidCc.length) { errEl.textContent = 'Invalid CC address: ' + invalidCc.join(', '); errEl.style.display = 'block'; return; }
    const recipients = computeRecipients();
    if (recipients.length === 0) { errEl.textContent = 'No valid email addresses found in the selected teams.'; errEl.style.display = 'block'; return; }

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData?.session?.access_token;
      const html = buildEmailHtml(subject, body);
      const res = await fetch(SUPABASE_URL + '/functions/v1/send-broadcast', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ recipients, cc, subject, body, html })
      });
      const result = await res.json().catch(() => null);
      if (!res.ok) throw new Error((result && result.error) || ('Request failed (' + res.status + ')'));
      okEl.textContent = 'Sent to ' + recipients.length + ' recipient(s).';
      okEl.style.display = 'block';
      selectedIds.clear();
      renderTable();
      setTimeout(closeBroadcast, 1800);
    } catch (err) {
      errEl.textContent = 'Failed to send: ' + err.message;
      errEl.style.display = 'block';
    } finally {
      sendBtn.disabled = false; sendBtn.textContent = 'Send';
    }
  }

  function exportCsv() {
    const cols = ['created_at','round','entry_type','team_name','college','track','problem_statement',
      'leader_name','leader_gender','leader_email','leader_phone','leader_year','leader_dept','leader_ieee',
      'ils_reg_id','payment_screenshot_url','supporting_doc_url'];
    let csv = cols.join(',') + '\n';
    allRows.forEach(r => {
      csv += cols.map(c => '"' + String(r[c] ?? '').replace(/"/g,'""') + '"').join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ils2026-registrations-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const { data } = await sb.auth.getSession();
    if (data.session) showDashboard();
  });
</script>
</body>
</html>
